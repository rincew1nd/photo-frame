name: photoframe
description: "Immich photo frame for Windows, Linux, and Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  logging: ^1.3.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  wakelock_plus: ^1.8.2
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol
  crypto: ^3.0.8
  flutter_localizations:
    sdk: flutter
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

dependency_overrides:
  flutter_secure_storage_windows:
    path: third_party/flutter_secure_storage_windows
