name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get --no-precompile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  # Platform builds are cold and slow; PRs are covered by analyze-test above.
  # Keep these out of required checks: a skipped job never reports a status.
  build-android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/stills
          key: stills-${{ runner.os }}-${{ hashFiles('scripts/fetch-stills-deps.*') }}
          restore-keys: |
            stills-${{ runner.os }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get --no-precompile
      - run: flutter build apk --debug --target-platform android-arm64 --no-pub

  build-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/stills
          key: stills-${{ runner.os }}-${{ hashFiles('scripts/fetch-stills-deps.*') }}
          restore-keys: |
            stills-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**', 'pubspec.lock') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get --no-precompile
      - run: flutter build windows --debug --no-pub

  build-linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/stills
          key: stills-${{ runner.os }}-${{ hashFiles('scripts/fetch-stills-deps.*') }}
          restore-keys: |
            stills-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get --no-precompile
      - run: flutter build linux --debug --no-pub
